<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="plotBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F9FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="idealGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#90CAF9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Markers -->
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#1976D2"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="500" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Multi-Agent Scaling Performance
  </text>
  <text x="350" y="50" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
    Speedup and SPL vs. Number of Agents (Medium Building Environment, 100 trials)
  </text>
  
  <!-- Main Plot Area -->
  <g transform="translate(80, 80)">
    <!-- Plot background -->
    <rect x="0" y="0" width="500" height="320" fill="url(#plotBg)" stroke="#DDD" stroke-width="1"/>
    
    <!-- Grid lines - horizontal -->
    <line x1="0" y1="64" x2="500" y2="64" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="0" y1="128" x2="500" y2="128" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="0" y1="192" x2="500" y2="192" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="0" y1="256" x2="500" y2="256" stroke="#E0E0E0" stroke-width="1"/>
    
    <!-- Grid lines - vertical -->
    <line x1="100" y1="0" x2="100" y2="320" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="320" stroke="#E0E0E0" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#E0E0E0" stroke-width="1"/>
    
    <!-- Ideal linear speedup shaded region -->
    <polygon points="0,320 100,256 200,192 300,128 400,64 500,0 500,320" fill="url(#idealGradient)" opacity="0.5"/>
    
    <!-- Ideal linear speedup line (dashed) -->
    <path d="M 0 320 L 100 256 L 200 192 L 300 128 L 400 64 L 500 0" 
          fill="none" stroke="#90CAF9" stroke-width="2" stroke-dasharray="8,4"/>
    
    <!-- Actual speedup curve (main line) - SEEK-Multi -->
    <!-- Points: (1,1.0), (2,1.87), (3,2.59), (4,3.10), (5,3.53), (6,3.85) -->
    <!-- Y scale: 320 - (speedup * 53.33) where 53.33 = 320/6 -->
    <path d="M 0 266.67 L 100 220.27 L 200 181.87 L 300 154.67 L 400 131.73 L 500 114.67" 
          fill="none" stroke="#1976D2" stroke-width="3"/>
    
    <!-- Data points with error bars for SEEK-Multi -->
    <!-- Agent 1 -->
    <line x1="0" y1="260" x2="0" y2="273" stroke="#1976D2" stroke-width="2"/>
    <line x1="-5" y1="260" x2="5" y2="260" stroke="#1976D2" stroke-width="2"/>
    <line x1="-5" y1="273" x2="5" y2="273" stroke="#1976D2" stroke-width="2"/>
    <circle cx="0" cy="266.67" r="6" fill="#1976D2" stroke="#FFF" stroke-width="2"/>
    
    <!-- Agent 2 -->
    <line x1="100" y1="208" x2="100" y2="232" stroke="#1976D2" stroke-width="2"/>
    <line x1="95" y1="208" x2="105" y2="208" stroke="#1976D2" stroke-width="2"/>
    <line x1="95" y1="232" x2="105" y2="232" stroke="#1976D2" stroke-width="2"/>
    <circle cx="100" cy="220.27" r="6" fill="#1976D2" stroke="#FFF" stroke-width="2"/>
    
    <!-- Agent 3 -->
    <line x1="200" y1="168" x2="200" y2="196" stroke="#1976D2" stroke-width="2"/>
    <line x1="195" y1="168" x2="205" y2="168" stroke="#1976D2" stroke-width="2"/>
    <line x1="195" y1="196" x2="205" y2="196" stroke="#1976D2" stroke-width="2"/>
    <circle cx="200" cy="181.87" r="6" fill="#1976D2" stroke="#FFF" stroke-width="2"/>
    
    <!-- Agent 4 -->
    <line x1="300" y1="139" x2="300" y2="170" stroke="#1976D2" stroke-width="2"/>
    <line x1="295" y1="139" x2="305" y2="139" stroke="#1976D2" stroke-width="2"/>
    <line x1="295" y1="170" x2="305" y2="170" stroke="#1976D2" stroke-width="2"/>
    <circle cx="300" cy="154.67" r="6" fill="#1976D2" stroke="#FFF" stroke-width="2"/>
    
    <!-- Agent 5 -->
    <line x1="400" y1="115" x2="400" y2="148" stroke="#1976D2" stroke-width="2"/>
    <line x1="395" y1="115" x2="405" y2="115" stroke="#1976D2" stroke-width="2"/>
    <line x1="395" y1="148" x2="405" y2="148" stroke="#1976D2" stroke-width="2"/>
    <circle cx="400" cy="131.73" r="6" fill="#1976D2" stroke="#FFF" stroke-width="2"/>
    
    <!-- Agent 6 -->
    <line x1="500" y1="96" x2="500" y2="133" stroke="#1976D2" stroke-width="2"/>
    <line x1="495" y1="96" x2="505" y2="96" stroke="#1976D2" stroke-width="2"/>
    <line x1="495" y1="133" x2="505" y2="133" stroke="#1976D2" stroke-width="2"/>
    <circle cx="500" cy="114.67" r="6" fill="#1976D2" stroke="#FFF" stroke-width="2"/>
    
    <!-- SPL line (secondary, on right axis) -->
    <!-- SPL values: 0.84, 0.81, 0.78, 0.75, 0.71, 0.68 -->
    <!-- Y scale for SPL: (1 - SPL) * 800, offset from top -->
    <path d="M 0 51.2 L 100 60.8 L 200 70.4 L 300 80 L 400 92.8 L 500 102.4" 
          fill="none" stroke="#E53935" stroke-width="2.5" stroke-dasharray="5,3"/>
    
    <!-- SPL data points -->
    <rect x="-5" y="46.2" width="10" height="10" fill="#E53935" stroke="#FFF" stroke-width="1.5" transform="rotate(45, 0, 51.2)"/>
    <rect x="95" y="55.8" width="10" height="10" fill="#E53935" stroke="#FFF" stroke-width="1.5" transform="rotate(45, 100, 60.8)"/>
    <rect x="195" y="65.4" width="10" height="10" fill="#E53935" stroke="#FFF" stroke-width="1.5" transform="rotate(45, 200, 70.4)"/>
    <rect x="295" y="75" width="10" height="10" fill="#E53935" stroke="#FFF" stroke-width="1.5" transform="rotate(45, 300, 80)"/>
    <rect x="395" y="87.8" width="10" height="10" fill="#E53935" stroke="#FFF" stroke-width="1.5" transform="rotate(45, 400, 92.8)"/>
    <rect x="495" y="97.4" width="10" height="10" fill="#E53935" stroke="#FFF" stroke-width="1.5" transform="rotate(45, 500, 102.4)"/>
    
    <!-- No Coordination baseline -->
    <path d="M 0 266.67 L 100 245 L 200 235 L 300 225 L 400 218 L 500 212" 
          fill="none" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="200" cy="235" r="4" fill="#9E9E9E"/>
    <circle cx="300" cy="225" r="4" fill="#9E9E9E"/>
    <circle cx="400" cy="218" r="4" fill="#9E9E9E"/>
    <circle cx="500" cy="212" r="4" fill="#9E9E9E"/>
    
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="320" x2="500" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="500" y1="0" x2="500" y2="320" stroke="#E53935" stroke-width="2"/>
    
    <!-- X-axis labels -->
    <text x="0" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">1</text>
    <text x="100" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">2</text>
    <text x="200" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">3</text>
    <text x="300" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">4</text>
    <text x="400" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">5</text>
    <text x="500" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">6</text>
    
    <!-- X-axis title -->
    <text x="250" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Number of Agents
    </text>
    
    <!-- Left Y-axis labels (Speedup) -->
    <text x="-10" y="324" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#1976D2">0×</text>
    <text x="-10" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#1976D2">1×</text>
    <text x="-10" y="217" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#1976D2">2×</text>
    <text x="-10" y="163" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#1976D2">3×</text>
    <text x="-10" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#1976D2">4×</text>
    <text x="-10" y="56" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#1976D2">5×</text>
    <text x="-10" y="3" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#1976D2">6×</text>
    
    <!-- Left Y-axis title -->
    <text x="-55" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976D2" transform="rotate(-90, -55, 160)">
      Speedup (×)
    </text>
    
    <!-- Right Y-axis labels (SPL) -->
    <text x="515" y="324" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#E53935">0.40</text>
    <text x="515" y="256" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#E53935">0.50</text>
    <text x="515" y="192" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#E53935">0.60</text>
    <text x="515" y="128" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#E53935">0.70</text>
    <text x="515" y="64" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#E53935">0.80</text>
    <text x="515" y="3" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#E53935">0.90</text>
    
    <!-- Right Y-axis title -->
    <text x="560" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#E53935" transform="rotate(90, 560, 160)">
      SPL (Team)
    </text>
    
    <!-- Annotations -->
    <!-- Near-linear region -->
    <rect x="5" y="140" width="290" height="175" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="4,2" rx="5"/>
    <text x="150" y="155" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#4CAF50" font-weight="bold">Near-Linear Scaling Region</text>
    
    <!-- Diminishing returns annotation -->
    <path d="M 360 95 Q 380 75 410 80" fill="none" stroke="#FF9800" stroke-width="1.5"/>
    <text x="415" y="75" font-family="Arial, sans-serif" font-size="9" fill="#FF9800">Diminishing</text>
    <text x="415" y="87" font-family="Arial, sans-serif" font-size="9" fill="#FF9800">returns</text>
    
    <!-- Speedup values annotations -->
    <text x="0" y="255" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1976D2" font-weight="bold">1.0×</text>
    <text x="100" y="208" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1976D2" font-weight="bold">1.87×</text>
    <text x="200" y="168" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1976D2" font-weight="bold">2.59×</text>
    <text x="300" y="140" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1976D2" font-weight="bold">3.10×</text>
    <text x="400" y="118" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1976D2" font-weight="bold">3.53×</text>
    <text x="500" y="100" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1976D2" font-weight="bold">3.85×</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="500" height="55" fill="#FFF" stroke="#DDD" rx="5"/>
    
    <!-- SEEK-Multi Speedup -->
    <line x1="20" y1="18" x2="50" y2="18" stroke="#1976D2" stroke-width="3"/>
    <circle cx="35" cy="18" r="5" fill="#1976D2" stroke="#FFF" stroke-width="1.5"/>
    <text x="60" y="22" font-family="Arial, sans-serif" font-size="10" fill="#333">SEEK-Multi Speedup</text>
    
    <!-- Ideal Linear -->
    <line x1="180" y1="18" x2="210" y2="18" stroke="#90CAF9" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="220" y="22" font-family="Arial, sans-serif" font-size="10" fill="#333">Ideal Linear Speedup</text>
    
    <!-- SPL -->
    <line x1="350" y1="18" x2="380" y2="18" stroke="#E53935" stroke-width="2.5" stroke-dasharray="5,3"/>
    <rect x="360" y="13" width="8" height="8" fill="#E53935" transform="rotate(45, 364, 17)"/>
    <text x="390" y="22" font-family="Arial, sans-serif" font-size="10" fill="#333">Team SPL</text>
    
    <!-- No Coordination -->
    <line x1="20" y1="42" x2="50" y2="42" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="35" cy="42" r="3" fill="#9E9E9E"/>
    <text x="60" y="46" font-family="Arial, sans-serif" font-size="10" fill="#333">No Coordination (baseline)</text>
    
    <!-- Error bars note -->
    <text x="250" y="46" font-family="Arial, sans-serif" font-size="9" fill="#666" font-style="italic">Error bars: ±1 std. dev.</text>
  </g>
</svg>